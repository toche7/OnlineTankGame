<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cannon Clash - Battle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Rotate-to-landscape overlay shown on portrait mobile devices -->
  <div id="rotateOverlay" class="rotate-overlay hidden">
    <div class="rotate-content">
      <p>Please rotate your device to landscape to play.</p>
      <p class="sub">Rotate the phone or use landscape mode on tablet.</p>
    </div>
  </div>
  <div id="container">
    <div id="ui">
      <div id="playerInfo">
        <h2>Cannon Clash</h2>
        <p id="spectatorMode" style="display: none; background: #ff9800; color: #000; padding: 10px; border-radius: 5px; font-weight: bold; text-align: center; margin-bottom: 10px;">👁️ SPECTATOR MODE</p>
        <p id="teamDisplay" style="display: none; font-weight: bold; font-size: 1.1em;"></p>
        <p>Time: <span id="gameTime">0:00</span> / 5:00</p>
        <p>Players: <span id="playerCount">0</span></p>
        <p id="healthDisplay">Health: <span id="health">100</span></p>
        <p id="livesDisplay">Lives: <span id="lives">3</span></p>
        <p id="ammoDisplay" style="display: none;">Ammo: <span id="ammo">20</span></p>
        <p id="scoreDisplay">Score: <span id="score">0</span></p>
        <p id="killsDisplay">Kills: <span id="kills">0</span></p>
        <div id="leaderboard">
          <h3>Leaderboard</h3>
          <ul id="scoreList"></ul>
        </div>
      </div>
    </div>
    <div id="gameContainer">
      <canvas id="gameCanvas"></canvas>

      <!-- Mobile Controls -->
      <div id="mobileControls" class="mobile-controls">
        <!-- Virtual Joystick for Movement -->
        <div id="joystickContainer" class="joystick-container">
          <div id="joystickBase" class="joystick-base">
            <div id="joystickHandle" class="joystick-handle"></div>
          </div>
        </div>

        <!-- Right-side Aim Joystick (acts as fire + aim control) -->
        <div id="aimJoystickContainer" class="aim-joystick-container">
          <div id="aimJoystickBase" class="aim-joystick-base">
            <div id="aimJoystickHandle" class="aim-joystick-handle"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Finish Screen Modal -->
  <div id="finishScreen" class="modal hidden">
    <div class="modal-content">
      <h1 id="finishTitle">GAME OVER</h1>
      <p id="finishReason"></p>
      <p id="finishStatus"></p>
      <div id="finishStats" class="finish-stats"></div>
      <div class="button-container">
        <a href="#" id="statsLink" class="finish-button stats-btn">📊 View Stats</a>
        <button id="restartBtn" class="finish-button restart-btn">Restart Game</button>
        <button id="closeBtn" class="finish-button close-btn">Close Game</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
