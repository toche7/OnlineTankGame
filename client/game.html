<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cannon Clash - Battle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="container">
    <div id="ui">
      <div id="playerInfo">
        <h2>Cannon Clash</h2>
        <p id="teamDisplay" style="display: none; font-weight: bold; font-size: 1.1em;"></p>
        <p>Time: <span id="gameTime">0:00</span> / 5:00</p>
        <p>Players: <span id="playerCount">0</span></p>
        <p>Health: <span id="health">100</span></p>
        <p>Lives: <span id="lives">3</span></p>
        <p id="ammoDisplay" style="display: none;">Ammo: <span id="ammo">20</span></p>
        <p>Score: <span id="score">0</span></p>
        <p>Kills: <span id="kills">0</span></p>
        <div id="leaderboard">
          <h3>Leaderboard</h3>
          <ul id="scoreList"></ul>
        </div>
      </div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <!-- Team Chat -->
    <div id="chatContainer" style="position: absolute; bottom: 10px; left: 10px; width: 350px; display: none;">
      <div id="chatMessages" style="background: rgba(0,0,0,0.8); border: 2px solid #444; border-radius: 5px; padding: 10px; max-height: 150px; overflow-y: auto; margin-bottom: 5px; font-size: 0.9em;">
      </div>
      <div style="display: flex; gap: 5px;">
        <input type="text" id="chatInput" placeholder="Team chat (press Enter)" style="flex: 1; padding: 8px; background: rgba(0,0,0,0.8); border: 2px solid #444; border-radius: 5px; color: white; font-size: 0.9em;">
        <button id="toggleChat" style="padding: 8px 15px; background: #444; border: none; border-radius: 5px; color: white; cursor: pointer;">Hide</button>
      </div>
    </div>
  </div>

  <!-- Finish Screen Modal -->
  <div id="finishScreen" class="modal hidden">
    <div class="modal-content">
      <h1 id="finishTitle">GAME OVER</h1>
      <p id="finishReason"></p>
      <p id="finishStatus"></p>
      <div id="finishStats" class="finish-stats"></div>
      <div class="button-container">
        <a href="#" id="statsLink" class="finish-button stats-btn">📊 View Stats</a>
        <button id="restartBtn" class="finish-button restart-btn">Restart Game</button>
        <button id="closeBtn" class="finish-button close-btn">Close Game</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
